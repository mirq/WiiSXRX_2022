# WiiStation for WarpOS -- settings (key = value), read at start.
# Every key can also be given as an argument (Core=1) or an ENV: variable
# (SetEnv WSX_Core 1); arguments win over ENV:, ENV: over this file.

# CPU core: 1 = interpreter, 2 = PPC dynarec
Core = 2
# GPU: 0 = software (P.E.Op.S.), 1 = software (gpulib), 2 = Radeon (GlesGpu on MiniGL)
gpuPlugin = 2
# BIOS: put the file in PROGDIR:bios/; BiosDevice 0 = HLE (no BIOS file)
BiosDevice = 1
BiosFile = "SCPH1001.BIN"
BiosDir = "PROGDIR:bios"
# 1 = show the BIOS boot screen
BootThruBios = 0
# Sound: 1 = on
Audio = 1
# 1 = frame limiter on (F10 toggles it)
LimitFrames = 1
# Pads: 0 = digital, 1 = analog (DualShock)
ControllerType = 0
# 1 = bilinear filtering
BilinearFilter = 1
ForceNTSC = 0
